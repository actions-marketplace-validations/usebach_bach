# Checked by cargo-deny in CI (`cargo deny check`): known security advisories,
# licenses, sources and duplicate or banned crates. A finding fails the job.

[graph]
# Bach's setup runtime is Windows only, so check what it is built from there.
targets = ["x86_64-pc-windows-msvc"]

[advisories]
# Unmaintained crates deep in the GPUI tree are reported, not fatal: only real
# vulnerabilities fail the job.
unmaintained = "workspace"
yanked = "deny"

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "0BSD",
    "BSL-1.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
