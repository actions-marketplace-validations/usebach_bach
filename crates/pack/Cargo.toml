[package]
name = "bach-pack"
description = "The bach.toml config, the payload format and the path rules shared by the Bach builder and the setup runtime."
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
argon2 = { version = "0.6", features = ["zeroize"] }
chacha20poly1305 = { version = "0.10", features = ["stream"] }
ed25519-dalek = "2"
getrandom = "0.4"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
toml = "1.2"
zeroize = "1"
zstd = { version = "0.14", features = ["zstdmt"] }
